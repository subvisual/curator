name: Curator documentation
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to validate with current accepted rules
        required: true
        type: string
permissions: {}
concurrency:
  group: curator-documentation-${{ github.event.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout accepted code only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install accepted parser lock
        run: |
          python -I -m pip install --require-hashes --only-binary=:all: -r checks/requirements.lock
      - name: Validate proposed blobs as data
        run: python -I checks/github_run.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURATOR_TRUSTED_SHA: ${{ github.sha }}
